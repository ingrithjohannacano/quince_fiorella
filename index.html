<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación Quinceaños Fiorella</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    form { margin: 20px auto; width: 300px; }
    input, select, button { display: block; margin: 10px auto; padding: 8px; width: 100%; }
  </style>
</head>
<body>
  <h1>¡Mis Quinceaños!</h1>
  <p>Te invito a celebrar conmigo el 29 de agosto de 2026.</p>

  <!-- Formulario para sugerir canciones -->
  <h2>Sugerir Canción</h2>
  <form id="songForm">
    <input type="text" name="artist" placeholder="Artista" required>
    <input type="text" name="song" placeholder="Canción" required>
    <button type="submit">Enviar canción</button>
  </form>

  <!-- Formulario RSVP -->
  <h2>Confirmar Asistencia</h2>
  <form id="rsvpForm">
    <input type="text" name="name" placeholder="Tu nombre" required>
    <select name="response" required>
      <option value="Sí">Sí asistiré</option>
      <option value="No">No podré</option>
    </select>
    <input type="text" name="phone" placeholder="Teléfono">
    <button type="submit">Confirmar asistencia</button>
  </form>

  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxnS7046KpwHpEqUyYTJ4whK2KvX8HgePPq4xnhN2KdeLKZHQEnKBHN_m02J16J8Z4bNg/exec";

    // Enviar canciones
    document.getElementById("songForm").addEventListener("submit", e => {
      e.preventDefault();
      const data = {
        type: "song",
        artist: e.target.artist.value,
        song: e.target.song.value
      };
      fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify(data)
      }).then(() => alert("Canción enviada 🎶"));
    });

    // Enviar RSVP
    document.getElementById("rsvpForm").addEventListener("submit", e => {
      e.preventDefault();
      const data = {
        type: "rsvp",
        name: e.target.name.value,
        response: e.target.response.value,
        phone: e.target.phone.value
      };
      fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify(data)
      }).then(() => alert("Confirmación enviada ✅"));
    });
  </script>
</body>
</html>
